stages:
  - validate
  - test
  - build
  - publish-mock

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

backend-validate:
  stage: validate
  image: ghcr.io/astral-sh/uv:0.9.17-python3.12-bookworm-slim
  script:
    - cd backend
    - uv sync --locked --extra dev
    - uv run ruff check app tests
    - uv run ruff format --check app tests
    - uv run mypy app

frontend-validate:
  stage: validate
  image: node:22-bookworm-slim
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
    policy: pull-push
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run typecheck

compose-validate:
  stage: validate
  image: docker:27.5.1-cli
  script:
    - |
      if ! docker compose version; then
        echo "Docker Compose 2.24.4 or newer is required; install the Docker Compose plugin on the runner." >&2
        exit 1
      fi
    - |
      if ! docker compose -f docker-compose.yml config --no-env-resolution --quiet; then
        echo "App Compose validation failed. Check the Compose file and use Docker Compose 2.24.4 or newer." >&2
        exit 1
      fi
    - |
      if ! docker compose -f docker-compose.yml -f docker-compose.task8-e2e.yml config --no-env-resolution --quiet; then
        echo "Task 8 Compose validation failed. The overlay uses !override/!reset and needs Docker Compose 2.24.4 or newer." >&2
        exit 1
      fi

backend-test:
  stage: test
  needs: [backend-validate]
  image: ghcr.io/astral-sh/uv:0.9.17-python3.12-bookworm-slim
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # The dind service is job-scoped and discarded with the job, so Ryuk's
    # container reaper adds nothing and needs extra socket plumbing.
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - cd backend
    - uv sync --locked --extra dev
    - uv run pytest -q

frontend-test:
  stage: test
  needs: [frontend-validate]
  image: node:22-bookworm-slim
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
    policy: pull
  script:
    - cd frontend
    - npm ci
    - npm test
