stages:
  - validate
  - test
  - build
  - publish-mock

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

backend-validate:
  stage: validate
  image: ghcr.io/astral-sh/uv:0.9.17-python3.12-bookworm-slim
  script:
    - cd backend
    - uv sync --locked --extra dev
    - uv run ruff check app tests
    - uv run ruff format --check app tests
    - uv run mypy app

frontend-validate:
  stage: validate
  image: node:22-bookworm-slim
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
    policy: pull-push
  script:
    - cd frontend
    - npm ci
    - npm run lint
    - npm run typecheck

compose-validate:
  stage: validate
  image: docker:27.5.1-cli
  script:
    - |
      if ! docker compose version; then
        echo "Docker Compose 2.24.4 or newer is required; install the Docker Compose plugin on the runner." >&2
        exit 1
      fi
    - |
      if ! docker compose -f docker-compose.yml config --no-env-resolution --quiet; then
        echo "App Compose validation failed. Check the Compose file and use Docker Compose 2.24.4 or newer." >&2
        exit 1
      fi
    - |
      if ! docker compose -f docker-compose.yml -f docker-compose.task8-e2e.yml config --no-env-resolution --quiet; then
        echo "Task 8 Compose validation failed. The overlay uses !override/!reset and needs Docker Compose 2.24.4 or newer." >&2
        exit 1
      fi

backend-test:
  stage: test
  needs: [backend-validate]
  image: ghcr.io/astral-sh/uv:0.9.17-python3.12-bookworm-slim
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    # The dind service is job-scoped and discarded with the job, so Ryuk's
    # container reaper adds nothing and needs extra socket plumbing.
    TESTCONTAINERS_RYUK_DISABLED: "true"
  script:
    - cd backend
    - uv sync --locked --extra dev
    - uv run pytest -q tests app/services/hr/tests app/tests --ignore=app/routes/tests/test_candidate_rank.py

frontend-test:
  stage: test
  needs: [frontend-validate]
  image: node:22-bookworm-slim
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
    policy: pull
  script:
    - cd frontend
    - npm ci
    - npm test

backend-test-slow:
  stage: test
  needs: [backend-validate]
  image: ghcr.io/astral-sh/uv:0.9.17-python3.12-bookworm-slim
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_RYUK_DISABLED: "true"
  timeout: 1h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: true
    - when: manual
      allow_failure: true
  script:
    - cd backend
    - uv sync --locked --extra dev
    - uv run pytest --slow -q

e2e:
  stage: test
  needs: [backend-test, frontend-test]
  image: node:22-bookworm
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: db_admin
    POSTGRES_PASSWORD: db_admin_pw
    POSTGRES_DB: justice
    DATABASE_URL: postgresql+psycopg://app:app_pw@postgres:5432/justice
    DB_ADMIN_URL: postgresql+psycopg://db_admin:db_admin_pw@postgres:5432/justice
    # Synthetic CI-only values for the disposable Postgres above.
    JWT_SECRET: ci-secret-at-least-32-chars-long!!
    ALLOWED_ORIGINS: http://localhost:5173
    LOGIN_RATE_LIMIT: "10000/minute"
    VITE_API_BASE: http://localhost:8000/api
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/frontend/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/.npm/
    policy: pull
  script:
    - apt-get update && apt-get install -y --no-install-recommends python3-pip python3-venv curl
    - pip install --break-system-packages uv
    - cd backend
    - uv sync --locked --extra dev --python 3.12
    - uv run alembic upgrade head
    - uv run python -m app.scripts.seed
    - (uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 &)
    - cd ../frontend
    - npm ci
    - npm run build
    - (npx vite preview --host 0.0.0.0 --port 5173 &)
    - npx playwright install --with-deps chrome
    - |
      for url in http://localhost:8000/docs http://localhost:5173; do
        for i in $(seq 1 30); do curl -sf "$url" >/dev/null && break; sleep 2; done
        curl -sf "$url" >/dev/null || { echo "$url did not come up" >&2; exit 1; }
      done
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        npm run test:e2e:smoke
      else
        npm run test:e2e:full
      fi
  artifacts:
    when: on_failure
    expire_in: 1 week
    paths:
      - frontend/playwright-report/

.docker-build:
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false", "--insecure-registry=registry:5000"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

backend-image:
  extends: .docker-build
  stage: build
  needs: [backend-test, frontend-test, e2e, compose-validate]
  script:
    - docker build --target production -t "justice-backend:$CI_COMMIT_SHORT_SHA" backend
    - docker image inspect "justice-backend:$CI_COMMIT_SHORT_SHA" --format '{{.Id}}'

frontend-image:
  extends: .docker-build
  stage: build
  needs: [backend-test, frontend-test, e2e, compose-validate]
  script:
    - docker build --target runtime -t "justice-frontend:$CI_COMMIT_SHORT_SHA" frontend
    - docker image inspect "justice-frontend:$CI_COMMIT_SHORT_SHA" --format '{{.Id}}'

# Rebuilds the images and pushes them to a registry that exists only for this
# job (a registry:2 service). Proves the push/pull path without touching any
# real registry; nothing is retained after the job.
publish-mock:
  extends: .docker-build
  stage: publish-mock
  needs: [backend-image, frontend-image]
  services:
    - name: docker:27.5.1-dind
      alias: docker
      command: ["--tls=false", "--insecure-registry=registry:5000"]
    - name: registry:2.8.3
      alias: registry
  variables:
    MOCK_REGISTRY: registry:5000
  script:
    - |
      for spec in "backend:production" "frontend:runtime"; do
        name="${spec%%:*}"; target="${spec##*:}"
        ref="$MOCK_REGISTRY/justice-$name:$CI_COMMIT_SHORT_SHA"
        docker build --target "$target" -t "$ref" "$name"
        docker push "$ref"
        docker rmi "$ref"
        docker pull "$ref"
      done
