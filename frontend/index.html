<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Justice</title>
    <script src="/theme-bootstrap.js"></script>
  </head>
  <body>
    <!-- Painted as soon as the stylesheet has loaded, before the JS entry has
         downloaded and the session restore has run; React's first render replaces
         it. Same text and box as components/PageLoading.tsx, which ProtectedRoute
         and the route fallback render next, so the swap is not visible. Neutral on
         purpose (no nav chrome): the auth state is unknown until JS runs. It uses
         Heebo's own fallback font (Arial): a Heebo download started by this paint
         competes with the JS entry and delays the shell on slow connections. Heebo
         is not loaded yet when React replaces it either, so the font does not jump. -->
    <div id="root"><div data-testid="boot-placeholder" role="status" aria-live="polite" style="padding: 2rem; text-align: center; font-family: Arial, sans-serif">טוען...</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
