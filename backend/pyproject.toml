[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "bot*"]

[project]
name = "justice-backend"
version = "0.1.0"
description = "Army duty management backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "ortools>=9.10",
  "uvicorn[standard]>=0.27",
  "sqlalchemy>=2.0.27",
  "alembic>=1.13",
  "psycopg[binary]>=3.1",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "argon2-cffi>=23.1",
  "python-jose[cryptography]>=3.3",
  "slowapi>=0.1.9",
  "python-multipart>=0.0.9",
  "python-telegram-bot>=21.0",
  "openpyxl>=3.1",
  "holidays>=0.46",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-xdist>=3.5",
  "httpx>=0.27",
  "testcontainers[postgres]>=4.0",
  "hypothesis>=6.99",
  "ruff>=0.3",
  "mypy>=1.9",
  "types-python-jose>=3.3",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is the fast suite, parallel across CPU cores (~2 min). The 8
# @pytest.mark.slow large-scale CP-SAT cases (n≈100, m≈200, ~11 min combined)
# are deselected by a conftest.py hook unless --slow is passed.
# Area markers (algorithm, auth, hierarchy, duty, scoring, notifications,
# soldiers, misc) are assigned automatically by the same hook based on test
# file name — run a slice with e.g. `pytest -m algorithm`.
addopts = "-ra -q -n auto"
asyncio_mode = "auto"
markers = [
  "slow: large-scale CP-SAT tests (n≈100, m≈200); deselected by default, run with: pytest --slow",
  "algorithm: CP-SAT solver, scheduling model, fairness/effort scoring inputs",
  "auth: login, JWT, password policy, RBAC, registration/enrollment, security hardening",
  "hierarchy: hierarchy nodes (corps/division/unit/...) and duty-manager scope",
  "duty: assignments, shifts, swaps, constraints, exemptions, gimelim, hakpaza, duty config",
  "scoring: cumulative score / transparency / effort-score reporting",
  "notifications: notifications, email, Telegram, bot actions",
  "soldiers: soldier profile, soldier listing, Excel import",
  "misc: health check, audit log, settings loader",
]
