services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: db_admin
      POSTGRES_PASSWORD: db_admin_pw
      POSTGRES_DB: justice
    # Match production's Asia/Jerusalem timezone so CURRENT_DATE-based
    # defaults (e.g. Soldier.enrolled_at) don't drift near local midnight —
    # see backend/Dockerfile for the same fix on the app side.
    command: postgres -c timezone=Asia/Jerusalem
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_admin -d justice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./.docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  loki:
    image: grafana/loki:3.1.1
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./deploy/observability/loki-config.yml:/etc/loki/local-config.yaml:ro
      - ./.docker-data/loki:/loki

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ${PROMETHEUS_CONFIG:-./deploy/observability/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus

  schema-migration:
    image: justice-backend:dev
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
    env_file:
      - .env.defaults
      - path: .env
        required: false
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/certs:/app/certs:ro
    command: alembic upgrade head

  backend:
    image: justice-backend:dev
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
    ports:
      - "8000:8000"
    env_file:
      - .env.defaults
      - path: .env
        required: false
    environment:
      - LOG_DIR=/app/logs
      - LOKI_URL=http://loki:3100
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-migration:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
      - ./backend/certs:/app/certs:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  exchange-calendar-worker:
    image: justice-backend:dev
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
    profiles: [exchange-calendar]
    command: python -m app.exchange_calendar_worker
    env_file:
      - .env.defaults
      - path: .env
        required: false
    environment:
      LOG_DIR: /app/logs
      LOKI_URL: http://loki:3100
      LOKI_APP_LABEL: justice-exchange-calendar
      EXCHANGE_CALENDAR_ENABLED: ${EXCHANGE_CALENDAR_ENABLED:-false}
      EXCHANGE_EWS_URL: ${EXCHANGE_EWS_URL:-}
      EXCHANGE_MAILBOX: ${EXCHANGE_MAILBOX:-}
      EXCHANGE_USERNAME: ${EXCHANGE_USERNAME:-}
      EXCHANGE_AUTH_TYPE: ${EXCHANGE_AUTH_TYPE:-}
      EXCHANGE_REQUESTS_PER_MINUTE: ${EXCHANGE_REQUESTS_PER_MINUTE:-200}
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
      - ./backend/certs:/app/certs:ro
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      schema-migration:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules  # preserve node_modules built into the image
    depends_on:
      - backend

  telegram-bot:
    image: justice-backend:dev
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple/}
    command: watchfiles --filter python 'python -m bot.main' app/ bot/
    env_file:
      - .env.defaults
      - path: .env
        required: false
    environment:
      - LOG_DIR=/app/logs
      - LOKI_URL=http://loki:3100
      - LOKI_APP_LABEL=justice-bot
    volumes:
      - ./backend:/app
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
