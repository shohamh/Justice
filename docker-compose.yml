services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: db_admin
      POSTGRES_PASSWORD: db_admin_pw
      POSTGRES_DB: cod2
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_admin -d cod2"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/.venv  # preserve the venv built into the image
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules  # preserve node_modules built into the image
    depends_on:
      - backend

  telegram-bot:
    build: ./backend
    command: uv run watchfiles --filter python 'python -m bot.main' app/ bot/
    env_file: .env
    volumes:
      - ./backend:/app
      - /app/.venv  # preserve the venv built into the image
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
