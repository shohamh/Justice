services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: db_admin
      POSTGRES_PASSWORD: db_admin_pw
      POSTGRES_DB: cod2
    ports:
      - "5432:5432"
    volumes:
      - ./.docker-data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U db_admin -d cod2"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Run migrations (as db_admin via DB_ADMIN_URL) then start the app server.
    # Migration 0001 creates the 'app' role idempotently, so a fresh DB is fine.
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        # VITE_API_BASE is baked into the static build. The browser connects to
        # the host's port 8000, so localhost:8000 is correct here.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000/api}
    ports:
      - "5173:5173"
    depends_on:
      - backend

  telegram-bot:
    build: ./backend
    command: uv run python -m bot.main
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
