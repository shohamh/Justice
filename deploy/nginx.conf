worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/javascript application/json;

    # SPA paths may carry one-time workflow tokens. Log the URI path only,
    # omitting query arguments and Referer values.
    log_format spa '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_user_agent"';

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;
        server_name _;

        # Keep one-time workflow tokens out of HTTP redirect access logs.
        # The /api/ location intentionally inherits the default combined log.
        location / {
            access_log /var/log/nginx/access.log spa;
            return 301 https://$host$request_uri;
        }

        location ^~ /api/ {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            access_log /var/log/nginx/access.log spa;
            include /etc/nginx/snippets/spa-security-headers.conf;
            try_files $uri $uri/ /index.html;
            location ~* \.(js|css|woff2?|png|svg|ico)$ {
                access_log /var/log/nginx/access.log spa;
                include /etc/nginx/snippets/spa-security-headers.conf;
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        location ^~ /api/file-download/ {
            proxy_pass http://file-gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://backend:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            client_max_body_size 50m;
        }
    }
}
