worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    # Missing from the stock mime.types of nginx:1.27-alpine. Static files get
    # X-Content-Type-Options: nosniff, and module scripts/workers need a JavaScript
    # type in any case: pdf.js loads /pdfjs/pdf.worker.min.mjs as a module worker.
    # ttf: KaTeX fonts. deploy/tests/test_nginx_static_types.sh checks a build.
    types {
        text/javascript mjs;
        font/ttf        ttf;
    }
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    # Level 6 instead of the default 1: about 15% fewer bytes for the JS/CSS
    # that every page load needs, for a little more CPU per response. Fonts
    # (woff2) and images other than SVG are already compressed and stay out.
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary     on;
    gzip_types    text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # Cache-Control per request path, added at server level (see the 443
    # server) and repeated in `location /`, whose security-header snippet
    # replaces the server-level add_header lines (nginx add_header inheritance).
    # `location = /theme-bootstrap.js` keeps its own `expires -1` (no-cache).
    #   - Vite's hashed bundles (/assets/) and the versioned fonts (/fonts/):
    #     cache forever; a deploy changes their names.
    #   - Other static files keep the year-long caching they had before.
    #   - Everything else, notably index.html and the SPA fallback (which
    #     ends as /index.html): revalidate on every visit, so a deploy is
    #     picked up at once and no stale index.html points at deleted chunks.
    #   - /api/: nothing added, the backend decides.
    map $uri $static_cache_control {
        ~^/api/                             "";
        ~^/(assets|fonts)/                  "public, max-age=31536000, immutable";
        ~*\.(js|css|woff2?|png|svg|ico)$    "public, max-age=31536000, immutable";
        default                             "no-cache";
    }

    # SPA paths may carry one-time workflow tokens. Log the URI path only,
    # omitting query arguments and Referer values.
    log_format spa '$remote_addr - $remote_user [$time_local] '
                   '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                   '"$http_user_agent"';

    # Per-IP API limit. A cold Home page load fires ~32 API requests at once and
    # many users share one IP (army NAT), so this is a coarse flood guard, not a
    # per-user limit. Login brute-force protection is separate: the backend's own
    # Redis-backed login limiter (backend/app/rate_limit.py) and per-account lockout.
    # Rejected requests get nginx's default limit_req_status (503).
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;

    server {
        listen 80;
        server_name _;

        # Keep one-time workflow tokens out of HTTP redirect access logs.
        # The /api/ location intentionally inherits the default combined log.
        location / {
            access_log /var/log/nginx/access.log spa;
            return 301 https://$host$request_uri;
        }

        location ^~ /api/ {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        # nginx 1.25.1+ syntax (image: nginx:1.27-alpine); lets the ~30 requests
        # of a cold page load share one connection instead of six.
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control $static_cache_control;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            access_log /var/log/nginx/access.log spa;
            include /etc/nginx/snippets/spa-security-headers.conf;
            # The snippet's add_header lines replace every server-level add_header
            # here, so the per-path Cache-Control has to be repeated.
            add_header Cache-Control $static_cache_control;
            try_files $uri $uri/ /index.html;
        }

        # This stable URL changes independently of hashed build assets, so
        # clients must revalidate it instead of caching it as immutable.
        location = /theme-bootstrap.js {
            access_log /var/log/nginx/access.log spa;
            include /etc/nginx/snippets/spa-security-headers.conf;
            expires -1;
        }

        location ^~ /api/file-download/ {
            proxy_pass http://file-gateway:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/ {
            limit_req zone=api burst=100 nodelay;
            proxy_pass         http://backend:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            client_max_body_size 50m;
        }
    }
}
