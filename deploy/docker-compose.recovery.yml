# Recovery-only overlay. Set PGDATA_RESTORE and AGE_IDENTITY_PATH in the
# protected environment file before use. Do not start this with the production
# project name: it changes only the isolated recovery project's database mounts.
services:
  db:
    volumes:
      - ${PGDATA_RESTORE:-/opt/justice/pgdata-restore}:/var/lib/postgresql/data
      - ${BACKUP_DIR:-/opt/justice/backups}:/backups:ro
      - ${WAL_ARCHIVE_DIR:-/opt/justice/wal-archive}:/var/lib/postgresql/wal-archive:ro
      - ${AGE_IDENTITY_PATH:?set AGE_IDENTITY_PATH to the recovery identity}:/run/secrets/age-identity:ro
    environment:
      AGE_IDENTITY_FILE: /run/secrets/age-identity
      PGDATA: /var/lib/postgresql/data
    # The restore script runs short-lived commands against this service with
    # docker compose run; this keeps ordinary recovery compose up from starting
    # Postgres before the backup has been extracted.
    command: ["sleep", "infinity"]
