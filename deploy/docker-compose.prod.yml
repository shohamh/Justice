# Usage: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d
#
# Prerequisites:
#   - Build frontend: cd frontend && npm ci && npm run build
#   - Place TLS certs at deploy/certs/cert.pem and deploy/certs/key.pem
#   - Copy deploy/.env.production.example to deploy/.env.production and fill in values
#   - Create dirs: sudo mkdir -p /opt/justice/pgdata /opt/justice/backups /opt/justice/logs /opt/justice/wal-archive /opt/justice/redis-data

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: justice
      # Enable WAL archiving for continuous backup
      POSTGRES_INITDB_ARGS: "--wal-segsize=64"
    command: >
      postgres
        -c wal_level=replica
        -c archive_mode=on
        -c archive_command='cp %p /var/lib/postgresql/wal-archive/%f'
        -c archive_timeout=60
        -c max_wal_senders=3
        -c wal_keep_size=512
        -c timezone=Asia/Jerusalem
    volumes:
      - /opt/justice/pgdata:/var/lib/postgresql/data
      - /opt/justice/backups:/backups
      - /opt/justice/wal-archive:/var/lib/postgresql/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d justice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /opt/justice/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  schema-migration:
    build:
      context: ../backend
      target: production
    restart: "no"
    env_file: .env.production
    environment:
      EXCHANGE_PASSWORD: ""
      ENVIRONMENT: production
      TZ: Asia/Jerusalem
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    env_file: .env.production
    # No LOKI_URL is configured here (accepted, human-escalated decision — a
    # Loki instance is only provisioned for dev, see deploy/observability/).
    # Without it, the admin errors inbox has no log store to read from and
    # returns 503 by design. See docs/architecture.md for details; set
    # LOKI_URL (to a reachable production Loki) once one is deployed.
    environment:
      LOG_DIR: /app/logs
      LOG_FORMAT: json
      EXCHANGE_PASSWORD: ""
      ENVIRONMENT: production
      TZ: Asia/Jerusalem  # see backend/Dockerfile — keeps date.today()/now() on Israel's calendar day
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      schema-migration:
        condition: service_completed_successfully
    volumes:
      - /opt/justice/logs:/app/logs
    # --forwarded-allow-ips=*: nginx is the only thing that can reach this
    # container (no host port mapping below), but it connects over the
    # Docker network rather than 127.0.0.1, so uvicorn's default trusted-proxy
    # list (127.0.0.1 only) never trusts its X-Forwarded-For/-Proto headers.
    # Without this, every request's client IP and https-ness collapse to
    # nginx's own connection, breaking per-IP rate limiting for all users.
    command: >
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4} --forwarded-allow-ips='*'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  exchange-calendar-worker:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    env_file: .env.production
    environment:
      EXCHANGE_CALENDAR_ENABLED: ${EXCHANGE_CALENDAR_ENABLED:-true}
      EXCHANGE_EWS_URL: ${EXCHANGE_EWS_URL:-}
      EXCHANGE_MAILBOX: ${EXCHANGE_MAILBOX:-}
      EXCHANGE_USERNAME: ${EXCHANGE_USERNAME:-}
      EXCHANGE_AUTH_TYPE: ${EXCHANGE_AUTH_TYPE:-}
      EXCHANGE_REQUESTS_PER_MINUTE: ${EXCHANGE_REQUESTS_PER_MINUTE:-200}
      LOG_DIR: /app/logs
      LOG_FORMAT: json
      EXCHANGE_PASSWORD: ""
      ENVIRONMENT: production
      TZ: Asia/Jerusalem
    command: python -m app.exchange_calendar_worker
    depends_on:
      db:
        condition: service_healthy
      schema-migration:
        condition: service_completed_successfully
    secrets:
      - EXCHANGE_PASSWORD

  telegram-bot:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    env_file: .env.production
    environment:
      LOG_DIR: /app/logs
      LOG_FORMAT: json
      EXCHANGE_PASSWORD: ""
      ENVIRONMENT: production
      TZ: Asia/Jerusalem
    volumes:
      - /opt/justice/logs:/app/logs
    command: python -m bot.main
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy

secrets:
  EXCHANGE_PASSWORD:
    file: ${EXCHANGE_PASSWORD_FILE:?Set EXCHANGE_PASSWORD_FILE to a file containing the svc_justice Exchange password}
