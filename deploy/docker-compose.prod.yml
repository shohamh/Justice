# Usage: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d
#
# Prerequisites:
#   - Build frontend: cd frontend && npm ci && npm run build
#   - Place TLS certs at deploy/certs/cert.pem and deploy/certs/key.pem
#   - Copy deploy/.env.production.example to deploy/.env.production and fill in values
#   - Create dirs: sudo mkdir -p /opt/justice/pgdata /opt/justice/backups /opt/justice/logs /opt/justice/wal-archive /opt/justice/redis-data

services:
  db:
    networks: [default, authz-db]
    build:
      context: ..
      dockerfile: deploy/postgres/Dockerfile
    image: justice-postgres:16-age1.2.1
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/prepare-postgres.sh"]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: justice
      AGE_BACKUP_RECIPIENTS: ${AGE_BACKUP_RECIPIENTS:?set AGE_BACKUP_RECIPIENTS in .env.production}
      AGE_BACKUP_RECIPIENTS_NEXT: ${AGE_BACKUP_RECIPIENTS_NEXT:-}
      # Enable WAL archiving for continuous backup
      POSTGRES_INITDB_ARGS: "--wal-segsize=64"
    command: >
      postgres
        -c wal_level=replica
        -c archive_mode=on
        -c archive_command='/usr/local/bin/archive-wal.sh %p %f'
        -c archive_timeout=60
        -c max_wal_senders=3
        -c wal_keep_size=512
        -c timezone=Asia/Jerusalem
    volumes:
      - ${PGDATA:-/opt/justice/pgdata}:/var/lib/postgresql/data
      - ${BACKUP_DIR:-/opt/justice/backups}:/backups
      - ${WAL_ARCHIVE_DIR:-/opt/justice/wal-archive}:/var/lib/postgresql/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d justice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - /opt/justice/redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    env_file: .env.production
    # No LOKI_URL is configured here (accepted, human-escalated decision — a
    # Loki instance is only provisioned for dev, see deploy/observability/).
    # Without it, the admin errors inbox has no log store to read from and
    # returns 503 by design. See docs/architecture.md for details; set
    # LOKI_URL (to a reachable production Loki) once one is deployed.
    environment:
      LOG_DIR: /app/logs
      LOG_FORMAT: json
      ENVIRONMENT: production
      TZ: Asia/Jerusalem  # see backend/Dockerfile — keeps date.today()/now() on Israel's calendar day
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - /opt/justice/logs:/app/logs
    # --forwarded-allow-ips=*: nginx is the only thing that can reach this
    # container (no host port mapping below), but it connects over the
    # Docker network rather than 127.0.0.1, so uvicorn's default trusted-proxy
    # list (127.0.0.1 only) never trusts its X-Forwarded-For/-Proto headers.
    # Without this, every request's client IP and https-ness collapse to
    # nginx's own connection, breaking per-IP rate limiting for all users.
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4} --forwarded-allow-ips='*'"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-bot:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    env_file: .env.production
    environment:
      LOG_DIR: /app/logs
      LOG_FORMAT: json
      ENVIRONMENT: production
      TZ: Asia/Jerusalem
    volumes:
      - /opt/justice/logs:/app/logs
    command: python -m bot.main
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  file-authorization:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      FILE_AUTHORIZATION_TLS_CERT: /run/tls/server.crt
      FILE_AUTHORIZATION_TLS_KEY: /run/tls/server.key
      FILE_AUTHORIZATION_GATEWAY_CA: /run/tls/ca.crt
    networks: [file-authz, authz-db]
    volumes:
      - ${FILE_STORAGE_TLS_DIR:-/opt/justice/certs/storage}/file-authorization.crt:/run/tls/server.crt:ro
      - ${FILE_STORAGE_TLS_DIR:-/opt/justice/certs/storage}/file-authorization.key:/run/tls/server.key:ro
      - ${FILE_STORAGE_TLS_DIR:-/opt/justice/certs/storage}/ca.crt:/run/tls/ca.crt:ro
    command: python -m app.file_authorization.main
    depends_on:
      db:
        condition: service_healthy

  file-gateway:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    environment:
      STORAGE_BUCKET: ${STORAGE_BUCKET:-justice-files}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
      STORAGE_CA_BUNDLE_PATH: ${STORAGE_CA_BUNDLE_PATH:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_GATEWAY_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_GATEWAY_SECRET_ACCESS_KEY:-}
      FILE_AUTHORIZATION_URL: https://file-authorization:8443
      FILE_AUTHORIZATION_CA: /run/tls/ca.crt
      FILE_GATEWAY_CLIENT_CERT: /run/tls/gateway.crt
      FILE_GATEWAY_CLIENT_KEY: /run/tls/gateway.key
    networks: [default, file-authz]
    volumes:
      - ${FILE_STORAGE_TLS_DIR:-/opt/justice/certs/storage}/gateway.crt:/run/tls/gateway.crt:ro
      - ${FILE_STORAGE_TLS_DIR:-/opt/justice/certs/storage}/gateway.key:/run/tls/gateway.key:ro
      - ${FILE_STORAGE_TLS_DIR:-/opt/justice/certs/storage}/ca.crt:/run/tls/ca.crt:ro
    command: uvicorn app.file_gateway.main:app --host 0.0.0.0 --port 8080
    depends_on:
      file-authorization:
        condition: service_started

  file-storage-maintenance:
    build:
      context: ../backend
      target: production
    profiles: [storage-maintenance]
    env_file:
      - ${FILE_STORAGE_MAINTENANCE_ENV_FILE:-/opt/justice/secrets/storage-maintenance.env}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-justice-files}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-true}
      STORAGE_CA_BUNDLE_PATH: ${STORAGE_CA_BUNDLE_PATH:-}
    command: ["python", "-m", "app.storage.maintenance_cli"]
    networks: [default]
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      file-gateway:
        condition: service_started

networks:
  file-authz:
    internal: true
  authz-db:
    internal: true
