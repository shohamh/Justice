# Usage: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env.production up -d
#
# Prerequisites:
#   - Build frontend: cd frontend && npm ci && npm run build
#   - Place TLS certs at deploy/certs/cert.pem and deploy/certs/key.pem
#   - Copy deploy/.env.production.example to deploy/.env.production and fill in values
#   - Create dirs: sudo mkdir -p /opt/justice/pgdata /opt/justice/backups /opt/justice/logs /opt/justice/wal-archive

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: justice
      # Enable WAL archiving for continuous backup
      POSTGRES_INITDB_ARGS: "--wal-segsize=64"
    command: >
      postgres
        -c wal_level=replica
        -c archive_mode=on
        -c archive_command='cp %p /var/lib/postgresql/wal-archive/%f'
        -c archive_timeout=60
        -c max_wal_senders=3
        -c wal_keep_size=512
    volumes:
      - /opt/justice/pgdata:/var/lib/postgresql/data
      - /opt/justice/backups:/backups
      - /opt/justice/wal-archive:/var/lib/postgresql/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d justice"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    env_file: deploy/.env.production
    environment:
      LOG_DIR: /app/logs
      LOG_FORMAT: json
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /opt/justice/logs:/app/logs
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-bot:
    build:
      context: ../backend
      target: production
    restart: unless-stopped
    env_file: deploy/.env.production
    environment:
      LOG_DIR: /app/logs
      LOG_FORMAT: json
    volumes:
      - /opt/justice/logs:/app/logs
    command: python -m bot.main
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
