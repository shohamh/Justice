name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # ─────────────────────────────────────────
  # Job 1: Backend — pytest (testcontainers manages its own Postgres)
  # ─────────────────────────────────────────
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Run tests
        run: .venv/bin/pytest -q --ignore=app/routes/tests/test_candidate_rank.py

  # ─────────────────────────────────────────
  # Job 2: Frontend — lint + vitest
  # ─────────────────────────────────────────
  frontend:
    name: Frontend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

  # ─────────────────────────────────────────
  # Job 3: E2E — full stack (Postgres service + backend + frontend)
  # ─────────────────────────────────────────
  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: db_admin
          POSTGRES_PASSWORD: db_admin_pw
          POSTGRES_DB: justice
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://app:app_pw@localhost:5432/justice
      DB_ADMIN_URL: postgresql+psycopg://db_admin:db_admin_pw@localhost:5432/justice
      JWT_SECRET: ci-secret-at-least-32-chars-long!!
      ALLOWED_ORIGINS: http://localhost:5173
      LOGIN_RATE_LIMIT: "10000/minute"

    steps:
      - uses: actions/checkout@v4

      # ── Backend setup ──
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/pyproject.toml"

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Run Alembic migrations
        working-directory: backend
        run: .venv/bin/alembic upgrade head

      - name: Seed database
        working-directory: backend
        run: .venv/bin/python -m app.scripts.seed

      - name: Start backend
        working-directory: backend
        run: .venv/bin/uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for backend
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/docs && break
            echo "Waiting for backend... ($i)"
            sleep 2
          done

      # ── Frontend setup ──
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_BASE: http://localhost:8000/api

      - name: Start frontend preview server
        working-directory: frontend
        run: npx vite preview --host 0.0.0.0 --port 5173 &

      - name: Wait for frontend
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:5173 && break
            echo "Waiting for frontend... ($i)"
            sleep 2
          done

      # ── Playwright ──
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chrome

      - name: Run Playwright tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Run forced-password Playwright flow
        working-directory: frontend
        run: |
          export PATH="$GITHUB_WORKSPACE/backend/.venv/bin:$PATH"
          npm run test:e2e:admin-flow

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
